<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plex Playlist Manager{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.1"></script>
    <script defer src="/static/js/playlist_tree.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        plex: {
                            bg: "#1f1f1f",
                            surface: "#282a2d",
                            elevated: "#3a3a3a",
                            accent: "#e5a00d",
                            accentHi: "#f5b62b",
                            text: "#ffffff",
                            muted: "#b0b0b0",
                            border: "#3a3a3a",
                        },
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-plex-bg text-plex-text font-sans antialiased min-h-screen">
    <header class="bg-plex-surface border-b border-plex-border px-6 py-4">
        <h1 class="text-xl font-semibold">
            <span class="text-plex-accent">Plex</span> Playlist Manager
        </h1>
    </header>

    <main class="flex h-[calc(100vh-65px)]">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
