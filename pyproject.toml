[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "plex-playlist-manager"
dynamic = ["version"]
description = ""
requires-python = ">=3.12"
authors = [{ name = "James Berkheimer", email = "james.berkheimer@gmail.com" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
]
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["plex_playlist_manager"]

[project.scripts]
ppm = "plex_playlist_manager.main:run"
scratch = "plex_playlist_manager.scratch:run"

[project.optional-dependencies]
dev = []